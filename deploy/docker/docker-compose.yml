services:
  echo-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${ECHO_SERVICE_IMAGE:-echo-service:amd64}
    restart: unless-stopped
    environment:
      ECHO_HTTPSERVER_LISTEN: ${ECHO_HTTP_LISTEN:-0.0.0.0:9090}
      ECHO_AUTH_SINGLESESSION: ${ECHO_AUTH_SINGLESESSION:-false}
      ECHO_AUTH_ACCESSTOKENTTL: ${ECHO_AUTH_ACCESSTOKENTTL:-24h}
      ECHO_AUTH_REFRESHTOKENTTL: ${ECHO_AUTH_REFRESHTOKENTTL:-168h}
      ECHO_AGENTCONNECTION_MAXMESSAGEBYTES: ${ECHO_AGENTCONNECTION_MAXMESSAGEBYTES:-52428800}
      ECHO_EVENTSTREAM_SUBSCRIBERQUEUESIZE: ${ECHO_EVENTSTREAM_SUBSCRIBERQUEUESIZE:-256}
      ECHO_EVENTSTREAM_ALLOWEDORIGINS: ${ECHO_EVENTSTREAM_ALLOWEDORIGINS:-}
      ECHO_DB_PATH: ${ECHO_DB_PATH:-/app/data/echo-service.db}
    ports:
      - "${ECHO_SERVICE_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ${ECHO_DATA_DIR:-./data}
        target: /app/data

